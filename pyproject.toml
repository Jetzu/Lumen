[project]
name = "lumen-imaging"
version = "0.1.1"
description = "Lumen: a modern, single-window scientific image analysis app with the ImageJ/Fiji toolbox."
readme = "README.md"
license = {text = "PolyForm-Noncommercial-1.0.0"}
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-image>=0.24",
  "tifffile>=2024.1.1",
  "imagecodecs>=2024.1.1",
  "imageio>=2.34",
  "matplotlib>=3.8",
  "pooch>=1.8",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.6",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45", "mcp>=1.10"]
# Browser end-to-end smoke tests (tests/e2e): needs Google Chrome; see tests/e2e/README.md
e2e = ["playwright>=1.45", "pytest>=8"]
# Optional readers/writers (all lazy-imported; Lumen runs without them).  olefile (pure Python) only speeds up /
# hardens the Zeiss ZVI reader, which has a built-in OLE parser as well.
formats = ["nd2", "czifile", "readlif", "pydicom>=3", "nibabel>=5", "mrcfile>=1.5", "h5py>=3", "zarr>=3", "openpyxl>=3.1", "xlrd>=2", "oiffile", "olefile>=0.46"]
# Java Bio-Formats bridge (lumen.core.readers.bioformats_bridge): every format the real Bio-Formats reads, through
# bioio-bioformats (scyjava + JPype).  Needs a JDK 11+ installed separately – Eclipse Temurin / OpenJDK builds are
# signed and notarized, so macOS does not complain – found via JAVA_HOME or `java` on PATH (scyjava can also fetch
# one with cjdk).  The first open downloads the Bio-Formats jars through Maven into ~/.m2 / ~/.jgo.  Pure wheels
# except jpype1, which ships binary wheels per Python version; see docs/PLATFORMS.md.
bioformats = ["bioio>=1.1", "bioio-bioformats>=1.0"]
# JVM script bridge (lumen.core.ijshim.jvm_bridge): Fiji's Groovy / BeanShell / Rhino JavaScript (opt-in JRuby / Clojure)
# scripts on a JVM with the real ij.jar, through scyjava + JPype – the same JDK requirement and one-time Maven download
# as the Bio-Formats bridge (or LUMEN_IJ_JAR / LUMEN_JVM_CLASSPATH for local jars, e.g. Fiji's); see docs/SCRIPTING.md.
jvm = ["jpype1>=1.5", "scyjava>=1.9"]
# Video (AVI/MP4) import/export. NOTE: imageio-ffmpeg ships an *unsigned* ffmpeg executable; on macOS,
# Gatekeeper may show an "Apple could not verify ... is free of malware" prompt the first time it runs.
# It is therefore opt-in and never installed by default.
video = ["imageio-ffmpeg>=0.5"]
formats-extra = ["astropy", "pynrrd", "bioio", "SimpleITK"]
# Deep-learning segmentation bridges
ml = ["cellpose", "stardist", "tensorflow"]
window = ["pywebview"]
# The MCP server (lumen-mcp): lets an AI assistant drive the running Lumen; see docs/MCP.md
mcp = ["mcp>=1.10"]

[project.scripts]
lumen = "lumen.__main__:main"
lumen-mcp = "lumen.mcp_server:main"
lumen-mcp-install = "lumen.mcp_server.install:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lumen*"]

[tool.setuptools.package-data]
lumen = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "e2e: browser end-to-end tests (Playwright + Google Chrome); deselect with -m \"not e2e\"",
  "crossval: cross-validation against ImageJ 1.54p (opt-in; needs java + ij.jar; see docs/CROSSVALIDATION.md)",
]
