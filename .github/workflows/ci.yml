name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: pytest · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    env:
      MPLBACKEND: Agg
      LUMEN_PLUGINS: ""
      # PYTHONUTF8 is deliberately NOT set: the Windows job must run with the legacy code page
      # (cp1252) so that any text file written without encoding="utf-8" fails here, not on a user's PC.
    steps:
      - uses: actions/checkout@v4

      # Keep the suite away from the runner's real ~/.lumen (recent files, plugins, sample cache).  Set here, not in
      # the job's env: the runner context is not available there and GitHub rejected the whole workflow file.
      - name: Isolate the Lumen folder
        run: echo "LUMEN_HOME=$RUNNER_TEMP/lumen-home" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Lumen with the dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Show the resolved environment
        run: python -m pip list --format=columns

      - name: Run the test-suite (engine, formats, API; no browser e2e)
        run: python -m pytest -q --ignore=tests/e2e -p no:cacheprovider

  frontend:
    name: frontend build · ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build (writes lumen/static)
        working-directory: frontend
        run: npm run build

      - name: Upload the built UI
        uses: actions/upload-artifact@v4
        with:
          name: lumen-static
          path: lumen/static
          if-no-files-found: error
          retention-days: 14
