name: Release

# Builds a wheel and an sdist (with the frontend bundled as lumen/static) when a version tag is
# pushed, and attaches them to the workflow run as artifacts. Nothing is published anywhere.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: wheel + sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend (bundled into the wheel as lumen/static)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, tomllib
          want = os.environ["GITHUB_REF_NAME"].lstrip("v")
          have = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert want == have, f"tag v{want} but pyproject.toml says {have}"
          print(f"version {have}")
          PY

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
          ls -l dist

      - name: Smoke-test the wheel on a clean interpreter
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          "$RUNNER_TEMP/wheel-test/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/wheel-test/bin/python" - <<'PY'
          import importlib.resources as r
          import lumen
          assert (r.files("lumen") / "static" / "index.html").is_file(), "lumen/static/index.html missing from the wheel"
          from lumen.core import ops  # noqa: F401  registers every command
          from lumen.core.registry import REGISTRY
          print(f"lumen {lumen.__version__}: {len(REGISTRY.ops)} commands, UI bundled")
          PY

      - name: Upload wheel and sdist
        uses: actions/upload-artifact@v4
        with:
          name: lumen-dist-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
